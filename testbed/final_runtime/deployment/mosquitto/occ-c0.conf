# OCC final-runtime MQTT C0 broker
#
# C0 intentionally provides:
# - no MQTT authentication
# - no TLS
#
# This file is ONLY for the C0 security profile.

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous true

persistence false

connection_messages true
log_type error
log_type warning
log_type notice
log_type information
