services:
  dashboard-frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:38081:8081"
    volumes:
      - ./_runtime/portable_occ/dashboard/static:/usr/share/nginx/html:ro
      - ./_runtime/portable_occ/dashboard/nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - occ-existing

networks:
  occ-existing:
    external: true
    name: occ-portable-stage_occ-stage
