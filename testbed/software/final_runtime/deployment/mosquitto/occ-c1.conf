# OCC final-runtime MQTT C1 broker
#
# C1 provides:
# - MQTT username/password authentication
# - no TLS
#
# Network/routing identity is not encoded in this file.

listener 1884 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /etc/mosquitto/passwd-fair-v1

persistence false

connection_messages true
log_type error
log_type warning
log_type notice
log_type information
